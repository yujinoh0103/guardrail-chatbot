# Real chatbot with mock input guard and up to one feedback regeneration.
input:
  response_mode: generate
  context_messages: 5
nodes:
  prepare:
    use: history/chatbot
    in:
    - history
    - user
    out: chat_context
    params:
      max_chars: 8192
      recent_messages: 4
      summary_chars: 1024
      excerpt_chars: 160
  g11:
    use: guard_in/mock
    in:
    - context
    - user
    out: g11
    params:
      keywords:
      - 위험
  bot:
    use: chatbot/default
    in:
    - chat_context
    - fb?
    out: candidate
    params:
      model: chatbot
  g12:
    use: guard_out/mock
    in:
    - context
    - user
    - candidate
    - g11
    out: fb
    params:
      mode: retry
  route:
    use: routers/mock
    in:
    - fb
    - calls
    out: next
    type: router
    params:
      retry_target: bot
      max_retries: 1
flow:
- prepare
- - g11
  - bot
- g12
- route
final: candidate
outputs:
- g11
- fb
limits:
  max_steps: 20
